<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade 6c - Positions</title>
<style>
body { font-family: Arial; margin: 30px; } .area { height: 310px; width: 450px; max-width: 100%; border: 1px solid #aaa; position: relative; } .quadrado { width: 50px; height: 50px; position: absolute; } .vermelho { background: red; top: 10px; left: 10px; } .amarelo { background: yellow; top: 10px; right: 10px; } .rosa { background: #ff00c8; top: 50%; left: 50%; transform: translate(-50%,-50%); } .azul { background: blue; bottom: 10px; left: 10px; } .verde { background: green; bottom: 10px; right: 10px; }
</style>
</head>
<body>
<h1>6c - Position</h1><div class="area"><div class="quadrado vermelho"></div><div class="quadrado amarelo"></div><div class="quadrado rosa"></div><div class="quadrado azul"></div><div class="quadrado verde"></div></div><p>O elemento pai usa position relative e as caixas usam absolute. Assim é possível colocar cada uma nos cantos ou no centro.</p><a href="index.html">Voltar</a>
</body>
</html>
