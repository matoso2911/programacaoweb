<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade 2 - Parágrafos</title>
<style>
body { margin: 30px; }
.p1 { color: blue; font-family: Arial; }
.p2 { color: green; font-family: Georgia; }
.p3 { color: purple; font-family: 'Courier New'; }
.p4 { color: #c44a22; font-family: Verdana; }
.p1 span { background: yellow; font-weight: bold; }
.p2 span { text-decoration: underline; color: red; }
.p3 span { font-size: 22px; }
.p4 span { background: #eee; font-style: italic; }
</style>
</head>
<body>
<h1>Parágrafos com estilos</h1>
<p class="p1">Lorem ipsum dolor sit amet, <span>consectetur</span> adipiscing elit.</p>
<p class="p2">Lorem ipsum dolor sit amet, <span>sed do eiusmod</span> tempor incididunt.</p>
<p class="p3">Lorem ipsum <span>dolor sit amet</span>, consectetur adipiscing elit.</p>
<p class="p4">Lorem ipsum dolor sit amet, <span>ut labore</span> et dolore magna aliqua.</p>

</html>
