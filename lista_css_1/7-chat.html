<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade 7 - Chat</title>
<style>
body { font-family: Arial; background: #eee; } .chat { width: 340px; max-width: 95%; margin: 40px auto; background: white; border: 1px solid #ccc; padding: 12px; } h2 { margin-top: 0; } .mensagem { border: 1px solid #ddd; margin: 12px 0; padding: 9px; border-radius: 5px; min-height: 38px; position: relative; overflow: hidden; } .recebida { background: #fff; margin-right: 35px; } .enviada { background: #cef5ce; margin-left: 35px; text-align: right; } .foto { background: #abd7f4; border-radius: 50%; width: 32px; height: 32px; line-height: 32px; text-align: center; float: left; margin-right: 10px; } .enviada .foto { float: right; margin: 0 0 0 10px; background: #e8c0a7; } small { color: #888; font-size: 10px; } textarea { width: 98%; height: 70px; box-sizing: border-box; resize: vertical; } button { float: right; margin-top: 6px; } .entrada { min-height: 110px; }
</style>
</head>
<body>
<div class="chat"><h2>Conversa</h2><div class="mensagem recebida"><div class="foto">P</div><small>Pedro Silva</small><br>Olá, tudo bem?<br><small>00:50</small></div><div class="mensagem enviada"><div class="foto">E</div><small>Eu</small><br>Estou bem sim, e você?<br><small>00:55</small></div><div class="mensagem recebida"><div class="foto">P</div><small>Pedro Silva</small><br>Vamos sair hoje? Faz tempo que não conversamos.<br><small>01:01</small></div><div class="mensagem enviada"><div class="foto">E</div><small>Eu</small><br>Podemos combinar!<br><small>01:05</small></div><div class="entrada"><textarea placeholder="Digite sua mensagem"></textarea><button type="button">Enviar</button></div></div><p style="text-align:center"><a href="index.html">Voltar</a></p>
</body>
</html>
