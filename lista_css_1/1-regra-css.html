<h1>Atividade 1 - O que é uma regra CSS?</h1>
<p>Uma regra CSS é um código que define a aparência de um elemento HTML. Ela tem um seletor, uma propriedade e um valor.</p>
<p>Exemplo: <code>h2 { color: blue; }</code></p>
<p>O <b>h2</b> é o seletor, <b>color</b> é a propriedade e <b>blue</b> é o valor.</p>
<h2>Esse título ficou azul por causa da regra.</h2>
