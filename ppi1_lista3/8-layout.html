<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 8</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #eeeeee; }
        .quadro { display: grid; width: 90%; max-width: 1000px; height: 450px; margin: 40px auto; background: white; padding: 10px; gap: 8px; grid-template-columns: 1.2fr 1fr 1.2fr 0.8fr; grid-template-rows: repeat(4, 1fr); }
        .quadro div { min-height: 0; }
        .a { background: #f4b332; grid-column: 1 / 3; }
        .b { background: #a7c66f; }
        .c { background: #f59f32; }
        .d { background: #f0a390; grid-row: 2 / 4; }
        .e { background: #a8bed4; grid-column: 2 / 4; }
        .f { background: #e6c5c1; }
        .g { background: #d3c3e5; grid-column: 2 / 4; }
        .h { background: #a7c66f; }
        .i { background: #f6a83c; grid-column: 1 / 3; }
        .j { background: #a8bed4; grid-column: 3 / 5; }
        @media screen and (max-width: 500px) {
            .quadro { width: 96%; height: auto; min-height: 700px; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(7, 90px); }
            .a { grid-column: 1 / 3; } .b { grid-column: 1; } .c { grid-column: 2; }
            .d { grid-row: span 2; } .e { grid-column: 2; } .f { grid-column: 2; }
            .g { grid-column: 1 / 3; } .h { grid-column: 1; } .i { grid-column: 2; } .j { grid-column: 1 / 3; }
        }
    </style>
</head>
<body>
    <div class="quadro">
        <div class="a"></div>
        <div class="b"></div>
        <div class="c"></div>
        <div class="d"></div>
        <div class="e"></div>
        <div class="f"></div>
        <div class="g"></div>
        <div class="h"></div>
        <div class="i"></div>
        <div class="j"></div>
    </div>
</body>
</html>
