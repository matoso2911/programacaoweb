<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .grid { display: grid; width: 620px; max-width: 95%; height: 440px; margin: 40px auto; gap: 8px; grid-template-columns: 1fr 1.5fr 1fr; grid-template-rows: 1fr 1fr 1fr 1fr; }
        .grid div { display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: bold; background: #ffda80; }
        .grid .vermelho { background: #ef4363; }
        .um { grid-column: 1 / 4; }
        .tres { grid-column: 2; grid-row: 2 / 4; }
        .cinco { grid-column: 1; grid-row: 3 / 5; }
        .sete { grid-column: 2 / 4; }
        @media(max-width: 480px) { .grid { height: 330px; gap: 5px; } }
    </style>
</head>
<body>
    <div class="grid">
        <div class="um">1</div>
        <div class="vermelho">2</div>
        <div class="tres">3</div>
        <div class="vermelho">4</div>
        <div class="cinco">5</div>
        <div class="vermelho">6</div>
        <div class="sete">7</div>
    </div>
</body>
</html>
